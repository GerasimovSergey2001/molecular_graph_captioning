[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "torch-scatter>=1.1.2",
    "transformers>=4.30.0",
    "rdkit>=2023.3.1",
    "nltk>=3.8.0",
    "plotly>=6.5.0",
    "nbformat>=5.10.4",
    "scikit-learn>=1.7.2",
    "torchmetrics>=1.8.2",
    "huggingface_hub",
    "matplotlib",
    "seaborn",
    "pandas",
    "ipykernel",
    "tqdm",
    "wandb",
    "comet_ml",
    "hydra-core",
    "black",
    "isort",
    "pre-commit",
    "timm>=1.0.23",
    "peft>=0.18.0",
    "ogb>=1.3.6",
    "pip>=25.3",
    "pubchempy>=1.0.5",
    "pyopsin>=0.2.4",
    "sacrebleu>=2.5.1",
    "bert-score>=0.3.13",
]

[tool.uv]
preview = true

[tool.uv.extra-build-dependencies]
torch-scatter = [
    { requirement = "torch", match-runtime = true }
    ] 
